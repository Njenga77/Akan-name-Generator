<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akan-name-generator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <div class="form-section" id="formSection">
            <h2>Name Generator</h2>
            <p>Discover your Akan name, based on the day of the week you were born.</p>
            <div class="date-row">
                <div class="input-box">
                    <label for="day">Day</label>
                    <input type="number" id="day" placeholder="DD" min="1" max="31">
                </div>
                <div class="input-box">
                    <label for="month">Month</label>
                    <input type="number" id="month" placeholder="MM" min="1" max="12">
                </div>
                <div class="input-box">
                    <label for="year">Year</label>
                    <input type="number" id="year" placeholder="YYYY">
                </div>
            </div>    

            <div class="input-box">
                <label for="gender">Choose Gender</label>
                <select id="gender" required >
                    <option value="">-- Select Gender --</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select> 
            </div>
            <button type="button" id="generate" class="btn">Generate Name</button>

        </div>
            <div class="result-card hidden" id="resultCard">
                <h2>Your Akan name</h2>
                <p id="bornOn"></p>
                <h1 id="akanName"></h1>
                <button type="button" id="reset" class="btn">Try Again</button>
            </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
